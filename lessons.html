<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AALTEEER - Shaxmat Akademiyasi</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      background: radial-gradient(circle at 50% 20%, #1d1733 0%, #0c0a14 60%, #050408 100%);
    }

    /* 6 Ta Toifa Skroll Menyusi */
    .tier-scroll-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px 14px;
      scrollbar-width: none;
    }
    .tier-scroll-bar::-webkit-scrollbar { display: none; }

    .tier-chip {
      white-space: nowrap;
      padding: 8px 14px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-glass);
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tier-chip.active {
      background: linear-gradient(135deg, #f5c563, #d49f33);
      color: #000;
      border-color: #ffe6a3;
      box-shadow: 0 0 15px rgba(245, 197, 99, 0.4);
    }

    /* Kengaytirilgan Zigzag Yo'l */
    .duo-container-wide {
      position: relative;
      max-width: 440px;
      margin: 0 auto;
      padding: 20px 10px 120px 10px;
      min-height: 100vh;
    }

    .pos-center { transform: translateX(0); }
    .pos-left { transform: translateX(-95px); }
    .pos-right { transform: translateX(95px); }

    /* Jonli Avatar Odamcha */
    .walking-avatar {
      position: absolute;
      top: -42px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 26px;
      z-index: 10;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.8));
      animation: avatarBounce 1.5s infinite ease-in-out;
      pointer-events: none;
    }

    @keyframes avatarBounce {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-8px); }
    }

    /* 4 Talik Rangli Test Tugmalari */
    .quiz-option-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .quiz-btn-choice {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      background: linear-gradient(145deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      border: 1px solid rgba(255,255,255,0.12);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.15s;
    }
    .quiz-btn-choice:active {
      transform: scale(0.98);
      border-color: var(--accent-gold);
      background: rgba(245, 197, 99, 0.15);
    }
    .choice-badge {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: rgba(245, 197, 99, 0.2);
      color: var(--accent-gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 900;
    }
  </style>
</head>
<body>

  <!-- Top Glass Header -->
  <div class="top-header">
    <div class="brand-box">
      <div class="brand-logo">🎓</div>
      <div class="brand-title">AKADEMIYA</div>
    </div>
    <div class="header-actions">
      <div class="user-badge" id="userTierBadge" onclick="startPlacementTest(true)">
        <span>⚡</span> <span id="tierTitleDisplay">Testdan o'tish</span>
      </div>
    </div>
  </div>

  <!-- 6 Ta Toifa Gorizontal Skroll Menyusi -->
  <div class="tier-scroll-bar">
    <div class="tier-chip active" id="tChip1" onclick="switchDivision(1)">🥉 1-Bronze</div>
    <div class="tier-chip" id="tChip2" onclick="switchDivision(2)">🥈 2-Silver 🔒</div>
    <div class="tier-chip" id="tChip3" onclick="switchDivision(3)">🥇 3-Gold 🔒</div>
    <div class="tier-chip" id="tChip4" onclick="switchDivision(4)">💍 4-Platinum 🔒</div>
    <div class="tier-chip" id="tChip5" onclick="switchDivision(5)">💎 5-Diamond 🔒</div>
    <div class="tier-chip" id="tChip6" onclick="switchDivision(6)">👑 6-Grandmaster 🔒</div>
  </div>

  <!-- Zigzag Kengaytirilgan Duolingo Xaritasi -->
  <div class="duo-container-wide">
    <svg class="duo-rope-svg" id="duoRopeSvg">
      <path class="duo-rope-path" id="duoRopePath" d=""></path>
    </svg>

    <div class="duo-nodes-wrapper" id="nodesContainer"></div>
  </div>

  <!-- Bottom Navigation -->
  <div class="bottom-navbar">
    <a href="index.html" class="nav-item">
      <span class="nav-icon">♟️</span>
      <span>Maydon</span>
    </a>
    <a href="analysis.html" class="nav-item">
      <span class="nav-icon">📊</span>
      <span>Tahlil</span>
    </a>
    <a href="lessons.html" class="nav-item active">
      <span class="nav-icon">🎬</span>
      <span>Darslar</span>
    </a>
    <a href="alterego.html" class="nav-item">
      <span class="nav-icon">🧬</span>
      <span>AI Bot</span>
    </a>
    <a href="auth.html" class="nav-item">
      <span class="nav-icon">👤</span>
      <span>Profil</span>
    </a>
  </div>

  <!-- 1. DARAJANI ANIQLASH TESTI (4 TA VARIANTLI) -->
  <div class="modal-overlay" id="placementModal" style="display:none;">
    <div class="modal-card" style="max-width:420px;">
      <div style="font-size:42px; margin-bottom:4px;">🧠</div>
      <h3 style="color:var(--accent-gold); font-size:18px;" id="placementHeadTitle">AI Darajani Aniqlash Testi</h3>
      <p style="font-size:11px; color:var(--text-muted); margin-bottom:12px;" id="placementStepText">Savol 1 / 5</p>

      <div style="background:#0b0a12; border:1px solid var(--border-glass); border-radius:14px; padding:14px; text-align:left;">
        <p style="font-size:13px; color:#fff; line-height:1.4;" id="placementQuestion"></p>
      </div>

      <div class="quiz-option-grid" id="placementOptionsContainer"></div>
    </div>
  </div>

  <!-- 2. BEKZOD ADMIN DARS SOZLASH MODALI -->
  <div class="modal-overlay" id="adminEditModal" style="display:none;">
    <div class="modal-card">
      <div style="font-size:36px; margin-bottom:6px;">👑</div>
      <h3 style="color:var(--accent-gold); font-size:17px; margin-bottom:4px;" id="adminEditTitle">Darsni Sozlash</h3>
      <p style="font-size:11px; color:var(--text-muted); margin-bottom:12px;">YouTube video linklarini kiriting:</p>

      <div class="input-group">
        <label class="input-label">Mavzu Nomi</label>
        <input type="text" id="inTopicTitle" class="custom-input" placeholder="Masalan: Markazni Nazorat Qilish">
      </div>
      <div class="input-group">
        <label class="input-label">Mavzu Videosi (YouTube Link)</label>
        <input type="text" id="inTopicVideo" class="custom-input" placeholder="https://youtube.com/watch?v=...">
      </div>
      <div class="input-group">
        <label class="input-label">Debyut Videosi (YouTube Link)</label>
        <input type="text" id="inOpeningVideo" class="custom-input" placeholder="https://youtube.com/watch?v=...">
      </div>

      <button class="btn btn-gold" style="width:100%; margin-bottom:8px;" onclick="saveLessonByAdmin()">
        Saqlash & AI Testini Generatsiya Qilish 🚀
      </button>
      <button class="btn" style="width:100%;" onclick="closeAdminEditModal()">Yopish</button>
    </div>
  </div>

  <!-- 3. O'QUVCHI UCHUN DARS & AI QUIZ MODALI -->
  <div class="modal-overlay" id="userStudyModal" style="display:none;">
    <div class="modal-card" style="max-height:90vh; overflow-y:auto; max-width:420px;">
      <h3 style="color:var(--accent-gold); font-size:17px; margin-bottom:10px;" id="studyLessonTitle">Dars</h3>
      
      <div id="studyVideosWrapper" style="margin-bottom:12px;"></div>

      <div style="background:#0b0a12; border:1px solid var(--border-glass); border-radius:14px; padding:14px; text-align:left;">
        <div style="font-size:11px; font-weight:800; color:var(--accent-cyan); margin-bottom:6px;">🧠 AI Taktika Savoli:</div>
        <p style="font-size:13px; color:#fff; margin-bottom:8px;" id="studyQuizQuestion"></p>
        <div class="quiz-option-grid" id="studyQuizOptions"></div>
      </div>

      <button class="btn" style="width:100%; margin-top:12px;" onclick="closeUserStudyModal()">Yopish</button>
    </div>
  </div>

  <script>
    const userSession = JSON.parse(localStorage.getItem('aalteeer_user') || '{}');
    if (!userSession.auth) {
      window.location.href = 'auth.html';
    }

    const isBekzodAdmin = !!userSession.isAdmin;
    let currentDivision = 1;
    let selectedLessonKey = "1.1";

    const tierNames = [
      "1-Bronze",
      "2-Silver",
      "3-Gold",
      "4-Platinum",
      "5-Diamond",
      "6-Grandmaster"
    ];

    const placementQuestions = [
      {
        q: "1. Shaxmat partiyasi boshida dastlab qaysi figuralarni rivojlantirish eng to'g'ri strategiya hisoblanadi?",
        opts: ["Og'ir figuralar (Rux va Farzin)", "Yengil figuralar (Ot va Fil)", "Chetdagi a va h piyodalari", "Faqat shoh bilan harakatlanish"],
        c: 1
      },
      {
        q: "2. Sitsiliya himoyasida (1. e4 c5) qoralarning bosh rejasi nima?",
        opts: ["Shohni darhol himoyasiz qoldirish", "Faqat durang qayd etish", "d4 katagini nazorat qilib, qarshi hujumga o'tish", "Farzinni 2-yurishdayoq qurbon qilish"],
        c: 2
      },
      {
        q: "3. 'Vilka' (Fork) taktik zarbasi nimani anglatadi?",
        opts: ["Bitta figura bilan bir vaqtda 2 yoki undan ortiq donaga xavf solish", "Raqib shohini burchakka qamash", "Farzinni orqaga qaytarish", "Piyodani himoyasiz surish"],
        c: 0
      },
      {
        q: "4. Endshpil bosqichida eng muhim hal qiluvchi omil nima?",
        opts: ["Shohning faollashishi va o'tkinchi piyodalar", "Barcha donalarni burchakda saqlash", "Shoshilinch taslim bo'lish", "Faqat passiv himoyalanish"],
        c: 0
      },
      {
        q: "5. 'Bog'lanish' (Pin) paytida himoyalanuvchi qanday ahvolga tushadi?",
        opts: ["Qo'shimcha harakat yutadi", "Dona harakatlana olmaydi yoki yursa ortidagi qimmatbaho figura boy beriladi", "Shoh mot bo'ladi", "Dona avtomatik o'yindan chiqadi"],
        c: 1
      }
    ];

    let placementIndex = 0;
    let placementScore = 0;

    function checkPlacementStatus() {
      const userLevel = localStorage.getItem('aalteeer_user_tier');
      if (!userLevel && !isBekzodAdmin) {
        startPlacementTest(false);
      } else {
        updateTierDisplay(userLevel || "1");
      }
    }

    function startPlacementTest(isManual) {
      placementIndex = 0;
      placementScore = 0;
      $('#placementModal').show();
      renderPlacementQuestion();
    }

    function renderPlacementQuestion() {
      const qObj = placementQuestions[placementIndex];
      $('#placementStepText').text(`Savol ${placementIndex + 1} / ${placementQuestions.length}`);
      $('#placementQuestion').text(qObj.q);

      let optsHtml = '';
      const letters = ['A', 'B', 'C', 'D'];
      qObj.opts.forEach((opt, idx) => {
        optsHtml += `
          <button class="quiz-btn-choice" onclick="answerPlacement(${idx})">
            <span class="choice-badge">${letters[idx]}</span>
            <span>${opt}</span>
          </button>
        `;
      });
      $('#placementOptionsContainer').html(optsHtml);
    }

    function answerPlacement(selectedIdx) {
      if (selectedIdx === placementQuestions[placementIndex].c) {
        placementScore++;
      }
      placementIndex++;
      if (placementIndex < placementQuestions.length) {
        renderPlacementQuestion();
      } else {
        finishPlacementTest();
      }
    }

    function finishPlacementTest() {
      $('#placementModal').hide();
      let assignedTier = 1;

      if (placementScore === 5) assignedTier = 6;
      else if (placementScore === 4) assignedTier = 4;
      else if (placementScore === 3) assignedTier = 3;
      else if (placementScore === 2) assignedTier = 2;
      else assignedTier = 1;

      localStorage.setItem('aalteeer_user_tier', assignedTier.toString());
      updateTierDisplay(assignedTier.toString());
      alert(`🎉 Natijangiz: ${placementScore}/5!\nSizga ${tierNames[assignedTier - 1]} ligasi belgilandi.`);
    }

    function updateTierDisplay(tier) {
      const tNum = parseInt(tier);
      $('#tierTitleDisplay').text(tierNames[tNum - 1]);
      
      $('.tier-chip').removeClass('active');
      const icons = ['🥉', '🥈', '🥇', '💍', '💎', '👑'];
      for (let i = 1; i <= 6; i++) {
        if (i <= tNum || isBekzodAdmin) {
          $(`#tChip${i}`).text(`${icons[i - 1]} ${tierNames[i - 1]}`);
        } else {
          $(`#tChip${i}`).text(`${icons[i - 1]} ${tierNames[i - 1]} 🔒`);
        }
      }
      $(`#tChip${tNum}`).addClass('active');
      currentDivision = tNum;
      renderDuolingoNodes();
    }

    function switchDivision(divNum) {
      const userTier = parseInt(localStorage.getItem('aalteeer_user_tier') || "1");
      if (divNum > userTier && !isBekzodAdmin) {
        alert(`🔒 ${tierNames[divNum - 1]} ligasi qulflangan! Avvalgi toifalarni yakunlang yoki daraja testini qayta topshiring.`);
        return;
      }
      currentDivision = divNum;
      $('.tier-chip').removeClass('active');
      $(`#tChip${divNum}`).addClass('active');
      renderDuolingoNodes();
    }

    function formatEmbedUrl(url) {
      if (!url) return '';
      let videoId = '';
      if (url.includes('youtu.be/')) videoId = url.split('youtu.be/')[1].split('?')[0];
      else if (url.includes('watch?v=')) videoId = url.split('watch?v=')[1].split('&')[0];
      else if (url.includes('embed/')) return url;
      return videoId ? `https://www.youtube.com/embed/${videoId}` : url;
    }

    function getLessonsDB() {
      return JSON.parse(localStorage.getItem('aalteeer_lessons_db') || '{}');
    }

    function renderDuolingoNodes() {
      const db = getLessonsDB();
      const userProgress = JSON.parse(localStorage.getItem('aalteeer_user_progress') || '[]');
      const container = $('#nodesContainer');
      container.empty();

      const positions = ['pos-center', 'pos-left', 'pos-center', 'pos-right', 'pos-center', 'pos-left', 'pos-center', 'pos-right', 'pos-center', 'pos-left'];

      let currentActiveNodeKey = null;

      for (let i = 1; i <= 10; i++) {
        const lessonKey = `${currentDivision}.${i}`;
        const lessonData = db[lessonKey];
        const isAdded = lessonData && (lessonData.topicVideo || lessonData.openingVideo);
        const isCompleted = userProgress.includes(lessonKey);

        let btnClass = "duo-circle-btn locked";
        let icon = "🔒";

        if (isBekzodAdmin) {
          btnClass = isAdded ? "duo-circle-btn active" : "duo-circle-btn";
          icon = isAdded ? "⭐" : "➕";
        } else {
          if (isCompleted) {
            btnClass = "duo-circle-btn completed";
            icon = "✅";
          } else if (isAdded) {
            btnClass = "duo-circle-btn active";
            icon = "⭐";
            if (!currentActiveNodeKey) currentActiveNodeKey = lessonKey;
          }
        }

        if (!currentActiveNodeKey && !isCompleted && isAdded) {
          currentActiveNodeKey = lessonKey;
        }

        const posClass = positions[i - 1];
        const hasAvatar = (currentActiveNodeKey === lessonKey) || (i === 1 && !currentActiveNodeKey);

        const nodeHtml = `
          <div class="${btnClass} ${posClass}" onclick="handleNodeClick('${lessonKey}')" style="position:relative;">
            ${hasAvatar ? '<div class="walking-avatar" title="Siz shu yerdasiz!">🛋️📱🧑‍💻</div>' : ''}
            ${isCompleted ? '<span class="duo-crown">👑</span>' : ''}
            <span class="duo-icon">${icon}</span>
            <span class="duo-label">${lessonKey}-Dars</span>
          </div>
        `;
        container.append(nodeHtml);
      }

      setTimeout(drawDuolingoRope, 120);
    }

    function drawDuolingoRope() {
      const nodes = document.querySelectorAll('.duo-circle-btn');
      if (nodes.length < 2) return;

      const svg = document.getElementById('duoRopeSvg');
      const path = document.getElementById('duoRopePath');
      const containerRect = document.querySelector('.duo-container-wide').getBoundingClientRect();

      let d = '';

      nodes.forEach((node, idx) => {
        const rect = node.getBoundingClientRect();
        const x = rect.left + rect.width / 2 - containerRect.left;
        const y = rect.top + rect.height / 2 - containerRect.top;

        if (idx === 0) {
          d += `M ${x} ${y}`;
        } else {
          const prevRect = nodes[idx - 1].getBoundingClientRect();
          const prevX = prevRect.left + prevRect.width / 2 - containerRect.left;
          const prevY = prevRect.top + prevRect.height / 2 - containerRect.top;
          const midY = (prevY + y) / 2;
          d += ` C ${prevX} ${midY}, ${x} ${midY}, ${x} ${y}`;
        }
      });

      path.setAttribute('d', d);
      svg.style.height = document.querySelector('.duo-container-wide').scrollHeight + 'px';
    }

    function handleNodeClick(key) {
      selectedLessonKey = key;
      const db = getLessonsDB();
      const lesson = db[key];

      if (isBekzodAdmin) {
        $('#adminEditTitle').text(`Darsni Sozlash: ${key}-Dars`);
        $('#inTopicTitle').val(lesson ? lesson.topicTitle : '');
        $('#inTopicVideo').val(lesson ? lesson.topicVideo : '');
        $('#inOpeningVideo').val(lesson ? lesson.openingVideo : '');
        $('#adminEditModal').show();
      } else {
        if (!lesson || (!lesson.topicVideo && !lesson.openingVideo)) {
          alert(`${key}-dars hali Bekzod tomonidan joylanmagan.`);
          return;
        }

        $('#studyLessonTitle').text(`${key}-Dars: ${lesson.topicTitle || 'Mavzu'}`);

        let vHtml = '';
        if (lesson.topicVideo) {
          vHtml += `<div style="font-size:11px; color:var(--accent-gold); margin-bottom:4px; font-weight:800;">📺 1. Mavzu Videosi:</div>
                    <iframe src="${formatEmbedUrl(lesson.topicVideo)}" style="width:100%; height:170px; border-radius:12px; border:none; margin-bottom:12px;" allowfullscreen></iframe>`;
        }
        if (lesson.openingVideo) {
          vHtml += `<div style="font-size:11px; color:var(--accent-gold); margin-bottom:4px; font-weight:800;">♟️ 2. Debyut Tahlili:</div>
                    <iframe src="${formatEmbedUrl(lesson.openingVideo)}" style="width:100%; height:170px; border-radius:12px; border:none; margin-bottom:12px;" allowfullscreen></iframe>`;
        }
        $('#studyVideosWrapper').html(vHtml);

        const quiz = lesson.quiz || generateBotQuiz(lesson.topicTitle || `${key}-Dars`);
        $('#studyQuizQuestion').text(quiz.q);

        let optHtml = '';
        const letters = ['A', 'B', 'C', 'D'];
        quiz.options.forEach((opt, idx) => {
          optHtml += `
            <button class="quiz-btn-choice" onclick="submitLessonQuizAnswer(${idx}, ${quiz.correct})">
              <span class="choice-badge">${letters[idx]}</span>
              <span>${opt}</span>
            </button>
          `;
        });
        $('#studyQuizOptions').html(optHtml);

        $('#userStudyModal').show();
      }
    }

    function generateBotQuiz(topic) {
      return {
        q: `${topic} mavzusi bo'yicha eng muhim strategik qoida qaysi?`,
        options: [
          "Figuralarni passiv himoyada ushlab turish",
          "Markazni nazorat qilish va faol hujum rejasini tuzish",
          "Shohni himoyasiz qoldirish",
          "Piyodalarni maqsadsiz oldinga surish"
        ],
        correct: 1
      };
    }

    function saveLessonByAdmin() {
      const topic = $('#inTopicTitle').val().trim();
      const topVid = $('#inTopicVideo').val().trim();
      const opnVid = $('#inOpeningVideo').val().trim();

      const db = getLessonsDB();
      db[selectedLessonKey] = {
        topicTitle: topic,
        topicVideo: topVid,
        openingVideo: opnVid,
        quiz: generateBotQuiz(topic || `${selectedLessonKey}-Dars`)
      };

      localStorage.setItem('aalteeer_lessons_db', JSON.stringify(db));
      $('#adminEditModal').hide();
      renderDuolingoNodes();
      alert(`✅ ${selectedLessonKey}-dars saqlandi va 4 talik AI testi tuzildi!`);
    }

    function closeAdminEditModal() { $('#adminEditModal').hide(); }
    function closeUserStudyModal() { $('#userStudyModal').hide(); }

    function submitLessonQuizAnswer(selected, correct) {
      if (selected === correct) {
        alert("🎉 To'g'ri javob! Dars muvaffaqiyatli yakunlandi. Avatar keyingi darsga o'tadi! 🚀");
        const progress = JSON.parse(localStorage.getItem('aalteeer_user_progress') || '[]');
        if (!progress.includes(selectedLessonKey)) {
          progress.push(selectedLessonKey);
          localStorage.setItem('aalteeer_user_progress', JSON.stringify(progress));
        }
        closeUserStudyModal();
        renderDuolingoNodes();
      } else {
        alert("❌ Noto'g'ri javob. Videoni qayta ko'rib chiqing!");
      }
    }

    $(document).ready(function() {
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
      }
      checkPlacementStatus();
      $(window).resize(drawDuolingoRope);
    });
  </script>
</body>
</html>
