<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AALTEEER Chess AI - Kirish</title>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root {
      --bg-primary: #12110f;
      --bg-card: #1e1c18;
      --accent: #3692e7;
      --accent-green: #2ecc71;
      --gold: #f1c40f;
      --text-main: #ffffff;
      --text-muted: #a0a0a0;
      --border-color: #33312b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at top, #201e19 0%, #12110f 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      width: 100%;
    }

    .lang-select {
      background-color: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    /* Brand Logo Area */
    .brand-section {
      text-align: center;
      margin: 30px 0 20px 0;
    }

    .logo-badge {
      width: 85px;
      height: 85px;
      margin: 0 auto 18px auto;
      background: linear-gradient(145deg, #2a2721, #191815);
      border: 2px solid var(--accent);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 44px;
      box-shadow: 0 10px 25px rgba(54, 146, 231, 0.25);
    }

    .brand-title {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 3px;
      color: var(--accent);
    }

    .brand-title span { color: var(--text-main); }
    
    .brand-desc {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 8px;
    }

    /* Auth Card Form */
    .auth-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    }

    .auth-title {
      font-size: 17px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 6px;
    }

    .auth-btn {
      width: 100%;
      padding: 15px;
      border: 1px solid var(--border-color);
      border-radius: 14px;
      background-color: #272520;
      color: var(--text-main);
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .auth-btn:active { transform: scale(0.97); }

    .btn-tg { background-color: #24A1DE; border-color: #24A1DE; }
    .btn-google { background-color: #ffffff; color: #12110f; border: none; }
    .btn-guest { background-color: transparent; border-color: var(--border-color); color: var(--text-muted); }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: #666;
      font-size: 12px;
      margin: 6px 0;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border-color);
    }

    .divider span { padding: 0 12px; }

    /* Katta Hashamatli Tabrik va AI Tanishtiruv Modali */
    .ai-guide-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(8px);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .guide-box {
      background: linear-gradient(165deg, #26241f, #181714);
      border: 2px solid var(--accent-green);
      border-radius: 24px;
      padding: 30px 24px;
      text-align: center;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 0 35px rgba(46, 204, 113, 0.35);
      animation: celebrationPop 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes celebrationPop {
      from { transform: scale(0.7); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .guide-celebration-badge {
      font-size: 54px;
      margin-bottom: 12px;
      display: inline-block;
      animation: floatBadge 2s infinite ease-in-out;
    }

    @keyframes floatBadge {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .guide-title {
      color: var(--accent-green);
      font-size: 22px;
      font-weight: 900;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }

    .guide-text {
      font-size: 15px;
      color: #f0f0f0;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .guide-btn {
      width: 100%;
      background: linear-gradient(90deg, #2ecc71, #27ae60);
      color: #ffffff;
      border: none;
      padding: 15px 24px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(46, 204, 113, 0.4);
      transition: transform 0.1s;
    }

    .guide-btn:active { transform: scale(0.97); }
  </style>
</head>
<body>

  <!-- Language Switcher -->
  <div class="top-bar">
    <select class="lang-select" id="langSwitcher" onchange="changeLanguage(this.value)">
      <option value="uz">O'zbekcha 🇺🇿</option>
      <option value="ru">Русский 🇷🇺</option>
      <option value="en">English 🇬🇧</option>
    </select>
  </div>

  <!-- Brand Logo -->
  <div class="brand-section">
    <div class="logo-badge">♟️</div>
    <div class="brand-title">AALTEEER <span>AI</span></div>
    <div class="brand-desc" id="t-subtitle">Sizning Shaxmatdagi Ikkinchi "Men"ingiz</div>
  </div>

  <!-- Auth Menu -->
  <div class="auth-card">
    <div class="auth-title" id="t-auth-title">Platformaga Xush Kelibsiz</div>
    
    <button class="auth-btn btn-tg" onclick="handleLogin('telegram')">
      <span>✈️</span> <span id="t-btn-tg">Telegram orqali kirish</span>
    </button>
    
    <button class="auth-btn btn-google" onclick="handleLogin('google')">
      <span>🌐</span> <span id="t-btn-google">Google orqali kirish</span>
    </button>

    <div class="divider"><span id="t-or">yoki</span></div>

    <button class="auth-btn btn-guest" onclick="handleLogin('guest')">
      <span>👤</span> <span id="t-btn-guest">Mehmon sifatida kirish</span>
    </button>
  </div>

  <div style="text-align: center; font-size: 11px; color: var(--text-muted);">
    AALTEEER Chess AI • Premium Edition
  </div>

  <!-- AI Katta Tabrik & Tanishtiruv Oynasi -->
  <div class="ai-guide-overlay" id="aiGuideModal">
    <div class="guide-box">
      <div class="guide-celebration-badge" id="guideBadge">🎉</div>
      <div class="guide-title" id="guideTitle">AALTEEER Loyihasiga Xush Kelibsiz!</div>
      <div class="guide-text" id="guideText">
        Tabriklaymiz! Siz sun'iy intellektga asoslangan noyob shaxmat olamiga muvaffaqiyatli qo'shildingiz.
      </div>
      <button class="guide-btn" id="guideBtn" onclick="nextGuideStep()">Boshlash 🚀</button>
    </div>
  </div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    const i18n = {
      uz: {
        subtitle: "Sizning Shaxmatdagi Ikkinchi \"Men\"ingiz",
        authTitle: "Platformaga Xush Kelibsiz",
        btnTg: "Telegram orqali kirish",
        btnGoogle: "Google orqali kirish",
        or: "yoki",
        btnGuest: "Mehmon sifatida kirish",
        welcomeTitle: "AALTEEER Olamiga Xush Kelibsiz! 🎉",
        welcomeText: "Tabriklaymiz! Siz sun'iy intellektga asoslangan noyob shaxmat platformasiga muvaffaqiyatli qo'shildingiz. Bu yerda siz o'z uslubingizdagi shaxsiy AI botingizni yaratishingiz va intellektual o'yinlardan zavq olishingiz mumkin!",
        startBtn: "O'yinni Boshlash 🚀"
      },
      ru: {
        subtitle: "Ваше второе «Я» в шахматах",
        authTitle: "Добро пожаловать",
        btnTg: "Войти через Telegram",
        btnGoogle: "Войти через Google",
        or: "или",
        btnGuest: "Войти как гость",
        welcomeTitle: "Добро пожаловать в AALTEEER! 🎉",
        welcomeText: "Поздравляем! Вы успешно присоединились к инновационной шахматной платформе с ИИ. Здесь вы сможете создать своего персонального клона-бота и наслаждаться глубокой игрой!",
        startBtn: "Начать игру 🚀"
      },
      en: {
        subtitle: "Your Chess Alter Ego",
        authTitle: "Welcome to Platform",
        btnTg: "Continue with Telegram",
        btnGoogle: "Continue with Google",
        or: "or",
        btnGuest: "Continue as Guest",
        welcomeTitle: "Welcome to AALTEEER! 🎉",
        welcomeText: "Congratulations! You have successfully joined the ultimate AI-powered chess ecosystem. Train, play, and clone your unique chess style into your own AI bot!",
        startBtn: "Get Started 🚀"
      }
    };

    let currentLang = 'uz';

    function changeLanguage(lang) {
      currentLang = lang;
      const t = i18n[lang];
      document.getElementById('t-subtitle').innerText = t.subtitle;
      document.getElementById('t-auth-title').innerText = t.authTitle;
      document.getElementById('t-btn-tg').innerText = t.btnTg;
      document.getElementById('t-btn-google').innerText = t.btnGoogle;
      document.getElementById('t-or').innerText = t.or;
      document.getElementById('t-btn-guest').innerText = t.btnGuest;
    }

    function handleLogin(provider) {
      localStorage.setItem('aalteeer_user', JSON.stringify({ auth: provider, lang: currentLang }));
      
      const t = i18n[currentLang];
      document.getElementById('guideTitle').innerText = t.welcomeTitle;
      document.getElementById('guideText').innerText = t.welcomeText;
      document.getElementById('guideBtn').innerText = t.startBtn;

      document.getElementById('aiGuideModal').style.display = 'flex';
    }

    function nextGuideStep() {
      // Asosiy maydonga yo'naltirish
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
