<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AALTEEER - Tahlil Doskasi & Study</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
  <link rel="stylesheet" href="style.css">
  
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    .eval-bar-wrapper {
      width: 100%;
      height: 12px;
      background: #2b293b;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 10px;
      border: 1px solid var(--border-glass);
      display: flex;
    }
    .eval-bar-fill {
      height: 100%;
      background: var(--accent-gold);
      width: 50%;
      transition: width 0.3s ease;
    }
    .study-box {
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .move-history-scroll {
      height: 60px;
      overflow-y: auto;
      background: #08070e;
      border: 1px solid var(--border-glass);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 12px;
      font-family: monospace;
      color: var(--accent-gold);
      line-height: 1.5;
    }
    .analysis-nav {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- Top Glass Header -->
  <div class="top-header">
    <div class="brand-box">
      <div class="brand-logo">📊</div>
      <div class="brand-title">TAHLIL & STUDY</div>
    </div>
    <div class="header-actions">
      <div class="user-badge" id="evalScoreDisplay">Baholash: +0.0</div>
    </div>
  </div>

  <div style="max-width: 440px; margin: 0 auto; padding: 12px 14px;">

    <!-- Evaluation Bar -->
    <div class="eval-bar-wrapper">
      <div class="eval-bar-fill" id="evalBarFill"></div>
    </div>

    <!-- Analysis Chessboard -->
    <div class="board-container">
      <div id="analysisBoard" style="width: 100%;"></div>
    </div>

    <!-- Navigation Controls -->
    <div class="analysis-nav">
      <button class="btn" onclick="goToStart()">|◀</button>
      <button class="btn" onclick="stepBackward()">◀</button>
      <button class="btn" onclick="stepForward()">▶</button>
      <button class="btn" onclick="goToEnd()">▶|</button>
    </div>

    <!-- Study & Variation Notes -->
    <div class="study-box" style="margin-top:12px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <span style="font-size:12px; font-weight:800; color:var(--accent-gold);">📖 Partiya Yurishlari Tarixi:</span>
        <button class="btn" style="padding:4px 8px; font-size:10px;" onclick="flipAnalysisBoard()">Doskani burish 🔄</button>
      </div>
      <div class="move-history-scroll" id="analysisPgnHistory">Boshlang'ich pozitsiya</div>
      
      <div style="margin-top:10px; font-size:11px; color:var(--text-muted);">
        💡 Eng yaxshi yurish tavsiyasi: <b id="bestMoveEngineText" style="color:var(--accent-green);">Tahlil qilinmoqda...</b>
      </div>
    </div>

    <!-- FEN / PGN Yuklash -->
    <div class="study-box">
      <input type="text" id="fenInput" class="custom-input" placeholder="FEN yoki PGN matnini joylang..." style="margin-bottom:8px;">
      <button class="btn btn-gold" style="width:100%; font-size:11px;" onclick="loadCustomFen()">Pozitsiyani O'rnatish 🚀</button>
    </div>

  </div>

  <!-- Bottom Navigation -->
  <div class="bottom-navbar">
    <a href="index.html" class="nav-item">
      <span class="nav-icon">♟️</span>
      <span>Maydon</span>
    </a>
    <a href="analysis.html" class="nav-item active">
      <span class="nav-icon">📊</span>
      <span>Tahlil & Study</span>
    </a>
    <a href="lessons.html" class="nav-item">
      <span class="nav-icon">🎬</span>
      <span>Darslar</span>
    </a>
    <a href="alterego.html" class="nav-item">
      <span class="nav-icon">🧬</span>
      <span>AI Bot</span>
    </a>
    <a href="auth.html" class="nav-item">
      <span class="nav-icon">👤</span>
      <span>Profil</span>
    </a>
  </div>

  <script>
    let aGame = new Chess();
    let aBoard = null;
    let moveHistory = [];
    let currentMoveIndex = 0;

    function runEngineAnalysis() {
      const fen = aGame.fen();
      $('#bestMoveEngineText').text("Tahlil qilinmoqda...");

      $.ajax({
        url: `https://stockfish.online/api/s/v2.php?fen=${encodeURIComponent(fen)}&depth=12`,
        type: 'GET',
        dataType: 'json',
        success: function(data) {
          if (data && data.success) {
            let evalVal = data.evaluation || "+0.0";
            $('#evalScoreDisplay').text(`Baholash: ${evalVal}`);
            
            // Eval bar foizini hisoblash
            let numEval = parseFloat(evalVal) || 0;
            let percent = 50 + (numEval * 5);
            percent = Math.max(5, Math.min(95, percent));
            $('#evalBarFill').css('width', `${percent}%`);

            if (data.bestmove) {
              const bestParts = data.bestmove.split(' ')[1];
              $('#bestMoveEngineText').text(bestParts ? `${bestParts.substring(0,2)} ➔ ${bestParts.substring(2,4)}` : "Topilmadi");
            }
          }
        },
        error: function() {
          $('#bestMoveEngineText').text("Avtonom tahlil faol");
        }
      });
    }

    function onAnalysisDrop(source, target) {
      const move = aGame.move({ from: source, to: target, promotion: 'q' });
      if (move === null) return 'snapback';
      
      updateHistoryDisplay();
      runEngineAnalysis();
    }

    function updateHistoryDisplay() {
      const pgn = aGame.pgn() || "Boshlang'ich pozitsiya";
      $('#analysisPgnHistory').text(pgn);
      $('#analysisPgnHistory').scrollTop($('#analysisPgnHistory')[0].scrollHeight);
    }

    function stepBackward() {
      const move = aGame.undo();
      if (move) {
        aBoard.position(aGame.fen());
        updateHistoryDisplay();
        runEngineAnalysis();
      }
    }

    function stepForward() {
      // Study keyingi qadam
      aBoard.position(aGame.fen());
      updateHistoryDisplay();
      runEngineAnalysis();
    }

    function goToStart() {
      aGame.reset();
      aBoard.start();
      updateHistoryDisplay();
      runEngineAnalysis();
    }

    function goToEnd() {
      aBoard.position(aGame.fen());
      updateHistoryDisplay();
      runEngineAnalysis();
    }

    function flipAnalysisBoard() {
      aBoard.flip();
    }

    function loadCustomFen() {
      const fen = $('#fenInput').val().trim();
      if (!fen) return alert("Iltimos, FEN matnini kiriting!");
      if (aGame.load(fen)) {
        aBoard.position(fen);
        updateHistoryDisplay();
        runEngineAnalysis();
        alert("Pozitsiya muvaffaqiyatli o'rnatildi!");
      } else {
        alert("Noto'g'ri FEN formati!");
      }
    }

    $(document).ready(function() {
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
      }

      aBoard = Chessboard('analysisBoard', {
        draggable: true,
        position: 'start',
        onDrop: onAnalysisDrop,
        onSnapEnd: () => aBoard.position(aGame.fen()),
        pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
      });

      $(window).resize(aBoard.resize);
      runEngineAnalysis();
    });
  </script>
</body>
</html>
