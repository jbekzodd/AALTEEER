<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AALTEEER Chess AI</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
  <link rel="stylesheet" href="style.css">
  
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-header">
    <div class="brand-box">
      <div class="brand-logo">♟️</div>
      <div class="brand-title">AALTEEER</div>
    </div>
    <div class="header-actions">
      <a href="auth.html" class="user-badge" id="userBadgeEl">
        <span>👤</span> <span id="userDisplayName">Hisob</span>
      </a>
    </div>
  </div>

  <!-- Main Game Container -->
  <div style="max-width: 440px; margin: 0 auto; padding: 12px 14px;">
    
    <!-- Skills Radar -->
    <div class="skills-card">
      <div class="skills-title">KO'NIKMALAR TAHLILI</div>
      <div class="skill-row">
        <span>Debyut</span>
        <div class="skill-track"><div class="skill-prog" style="width: 100%; background: var(--accent-gold);"></div></div>
        <span style="color:var(--accent-gold);">100%</span>
      </div>
      <div class="skill-row">
        <span>Taktika</span>
        <div class="skill-track"><div class="skill-prog" style="width: 80%; background: var(--accent-cyan);"></div></div>
        <span style="color:var(--accent-cyan);">80%</span>
      </div>
      <div class="skill-row">
        <span>Mittelshpil</span>
        <div class="skill-track"><div class="skill-prog" style="width: 55%; background: var(--accent-green);"></div></div>
        <span style="color:var(--accent-green);">55%</span>
      </div>
      <div class="skill-row">
        <span>Endshpil</span>
        <div class="skill-track"><div class="skill-prog" style="width: 40%; background: #a855f7;"></div></div>
        <span style="color:#a855f7;">40%</span>
      </div>
      <div class="skill-row">
        <span>Diqqat</span>
        <div class="skill-track"><div class="skill-prog" style="width: 90%; background: var(--accent-red);"></div></div>
        <span style="color:var(--accent-red);">90%</span>
      </div>
    </div>

    <!-- Match Info -->
    <div class="match-meta-bar">
      <div class="opponent-box">
        <div class="opponent-avatar" id="botAvatar">🔥</div>
        <div>
          <h4 id="botName" style="font-size:13px; font-weight:800;">Tajovuzkor Bot (Tal)</h4>
          <p id="botElo" style="font-size:11px; color:var(--text-muted);">Stockfish AI</p>
        </div>
      </div>
      <div class="game-status" id="gameTurnStatus">Sizning yurishingiz</div>
    </div>

    <!-- Fixed Chessboard Frame -->
    <div class="board-container">
      <div id="board" style="width: 100%;"></div>
    </div>

    <!-- Action Controls -->
    <div class="controls-grid">
      <button class="btn btn-gold" onclick="restartMatch()">🔄 Yangi</button>
      <button class="btn" onclick="undoMove()">↩️ Qaytarish</button>
      <button class="btn" id="voiceBtnEl" onclick="toggleHandsFreeVoice()">🎙️ Ovoz</button>
    </div>

  </div>

  <!-- Fixed Bottom Navigation -->
  <div class="bottom-navbar">
    <a href="index.html" class="nav-item active">
      <span class="nav-icon">♟️</span>
      <span>Maydon</span>
    </a>
    <a href="lessons.html" class="nav-item">
      <span class="nav-icon">🎬</span>
      <span>Darslar</span>
    </a>
    <a href="alterego.html" class="nav-item">
      <span class="nav-icon">🧬</span>
      <span>AI Bot</span>
    </a>
    <a href="auth.html" class="nav-item">
      <span class="nav-icon">👤</span>
      <span>Profil</span>
    </a>
  </div>

  <script src="app.js"></script>
</body>
</html>
